<!-- TOP FIXED WRAPPER -->
<div class="fixedTop">

  <!-- TOP BAR (Desktop Only) -->
  <div class="d-none d-lg-block">
    <div class="top-bar py-1 bg-light">
      <div class="container d-flex justify-content-end align-items-center">
        <ul class="list-styled d-flex mb-0" id="contact-info">
          <li>
            <a href="#" class="fw-bold top-bar-link">
              <i class="fa-solid fa-phone-volume icon mx-2"></i> {{ phone }}
            </a>
          </li>
          <li class="mx-2">|</li>
          <li>
            <a href="mailto: {{ mail }}" class="fw-bold top-bar-link">
              <i class="fa-regular fa-envelope icon mx-2"></i> {{ mail }}
            </a>
          </li>
          <li class="mx-2">|</li>
          <li>
            <a href="/Verifycertificate" class="fw-bold top-bar-link">
              <i class="fa-regular fa-file mx-2"></i> Verify Certificate
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg py-2">
    <div class="container-fluid d-flex align-items-center">

      <!-- LOGO -->
      <a class="navbar-brand" href="/">
        <img src="static/images/logo.png" alt="Logo" class="logo">
      </a>

      <!-- MOBILE TOGGLER -->
      <button class="navbar-toggler togglerButton" type="button"
        data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <img src="static/images/icons8-menu.gif" alt="Menu Icon" style="height: 24px;">
      </button>

      <!-- CENTER NAVIGATION -->
      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
        <ul class="navbar-nav gap-2 text-center">

          <li class="nav-item">
            <a class="nav-link styled-link {% if request.path == '/' %}active-link{% endif %}" href="/">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link styled-link {% if request.path == '/about-us' %}active-link{% endif %}"
              href="/about-us">About Us</a>
          </li>

          <li class="nav-item">
            <a class="nav-link styled-link {% if request.path == '/services' %}active-link{% endif %}"
              href="/services">Services</a>
          </li>

          <li class="nav-item">
            <a class="nav-link styled-link {% if request.path == '/training-courses' %}active-link{% endif %}"
              href="/training-courses">Training Courses</a>
          </li>

          <li class="nav-item">
            <a class="nav-link styled-link {% if request.path == '/careers' %}active-link{% endif %}"
              href="/careers">Careers</a>
          </li>

          <li class="nav-item">
            <a class="nav-link styled-link {% if request.path == '/news-blogs' %}active-link{% endif %}"
              href="/news-blogs">News & Blogs</a>
          </li>

          <li class="nav-item">
            <a class="nav-link styled-link {% if request.path == '/contact' %}active-link{% endif %}"
              href="/contact">Contact Us</a>
          </li>

        </ul>
      </div>

      <!-- RIGHT-SIDE ICONS WRAPPER -->
      <div class="d-flex align-items-center gap-3">

        <!-- Profile Icon -->
        <div class="nav-item position-relative d-flex align-items-center justify-content-center"
          style="width: 45px; height: 45px;">
          <a class="nav-link styled-link p-0" href="#download-section">
            <dotlottie-player id="hoverLottie"
              src="https://lottie.host/66513ce5-ad73-409e-bbfa-7c0c2b4bf68e/wBSP8oc94L.lottie"
              background="transparent" speed="1" style="width: 100px; height: 100px;" loop>
            </dotlottie-player>
          </a>
          <span class="custom-tooltip">Profile</span>
        </div>

        <!-- Portals Dropdown -->
        <div class="nav-item dropdown" id="portalsDropdown">
          <a class="nav-link styled-link d-flex align-items-center" href="#">
            Portals <i class="ri-arrow-down-s-line ms-1"></i>
          </a>
          <div class="dropdown-menu text-center">
            <a class="dropdown-item" href="#">Student Portal</a>
            <a class="dropdown-item" href="#">Vendor Portal</a>
            <a class="dropdown-item" href="#">Customer Portal</a>
            <a class="dropdown-item" href="#">Employee Portal</a>
          </div>
        </div>

        <!-- Location Lottie -->
        <a class="nav-link styled-link" href="#our-locations"
          style="width: 35px; height: 35px; display:flex; align-items:center; justify-content:center;">
          <dotlottie-player
            src="https://lottie.host/a0c08b52-c0ba-49f5-878d-02585178a7cc/5dO39dyEu4.lottie"
            background="transparent" speed="1"
            style="width:100%; height:100%;" loop autoplay>
          </dotlottie-player>
        </a>

        <!-- Country Dropdown -->
        <div class="animated-border-box d-flex align-items-center px-2 py-1">
          <form method="POST" action="/" class="mb-0">
            <select name="country" class="form-select fw-bold custom-dropdown border-0 bg-transparent text-center"
              onchange="this.form.submit()">
              <option value="Canada" {% if country=='Canada' %}selected{% endif %}>Canada</option>
              <option value="UK" {% if country=='UK' %}selected{% endif %}>UK</option>
              <option value="Qatar" {% if country=='Qatar' %}selected{% endif %}>Qatar</option>
              <option value="India" {% if country=='India' %}selected{% endif %}>India</option>
            </select>
          </form>
        </div>

      </div>

    </div>
  </nav>

</div>


<!-- LOTTIE SCRIPT -->
<script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>

<!-- Hover Control -->
<script type="module">
  const lottiePlayer = document.getElementById('hoverLottie');
  lottiePlayer.addEventListener('mouseenter', () => lottiePlayer.play());
  lottiePlayer.addEventListener('mouseleave', () => lottiePlayer.stop());
</script>

<!-- Portals Dropdown Hover -->
<script>
  const portals = document.getElementById('portalsDropdown');
  const menu = portals.querySelector('.dropdown-menu');

  portals.addEventListener('mouseenter', () => menu.style.display = 'block');
  portals.addEventListener('mouseleave', () => menu.style.display = 'none');
</script>

<style>
  /* Dropdown Hover */
  #portalsDropdown .dropdown-menu {
    display: none;
    border-radius: 0;
    border: none;
  }

  .dropdown-item:hover {
    background: #0C334A;
    color: white;
  }

  /* Tooltip */
  .custom-tooltip {
    visibility: hidden;
    opacity: 0;
    transition: .2s;
    position: absolute;
    top: 60%;
    left: 50%;
    transform: translate(-50%);
    background: white;
    color: #0C334A;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    white-space: nowrap;
  }

  .nav-item:hover .custom-tooltip {
    visibility: visible;
    opacity: 1;
  }

  /* Animated border */
  .animated-border-box {
    border: 3px solid transparent;
    border-radius: 10px;
    animation: borderMove 1s linear infinite;
  }

  @keyframes borderMove {
    0% {
      border-color: #06324A;
      box-shadow: 0 0 8px #06324A;
    }

    50% {
      border-color: #6CC57C;
      box-shadow: 0 0 12px #6CC57C;
    }

    100% {
      border-color: #06324A;
      box-shadow: 0 0 8px #06324A;
    }
  }

  /* Active Link */
  .active-link {
    color: #6CC57C !important;
    font-weight: 700;
  }
</style>
